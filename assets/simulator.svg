    <rect x="320" y="0" width="240" height="60" rx="8" fill="#e67e22"/>
    <text x="440" y="36" fill="#fff" text-anchor="middle" font-size="13">Simulator Script</text>

    <rect x="640" y="0" width="160" height="60" rx="8" fill="#27ae60"/>
    <text x="720" y="36" fill="#fff" text-anchor="middle" font-size="13">Server Socket</text>

    <line x1="240" y1="30" x2="320" y2="30" stroke="#ecf0f1" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="560" y1="30" x2="640" y2="30" stroke="#ecf0f1" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
